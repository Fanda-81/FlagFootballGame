<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b3d1f" />
    <title>Flag Football Pass — 腰旗橄榄球传球训练</title>
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  </head>
  <body>
    <div id="app">
      <!-- 竖屏提示层 -->
      <div id="rotate-hint" class="hidden">
        <div class="rotate-hint-card">
          <span class="rotate-icon">📱↻</span>
          <p>请旋转至<b>横屏</b>体验</p>
        </div>
      </div>

      <!-- 顶部 HUD -->
      <header id="hud">
        <div class="hud-item">
          <span class="hud-label">连击</span>
          <span id="hud-combo" class="hud-value">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">尝试</span>
          <span id="hud-attempts" class="hud-value">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">成功率</span>
          <span id="hud-rate" class="hud-value">—</span>
        </div>
      </header>

      <!-- 左侧功能按钮 -->
      <aside id="side-left">
        <button class="side-btn" id="btn-draw" title="抽卡">🎴<span>抽卡</span></button>
        <button class="side-btn" id="btn-cards" title="球员卡">🃏<span>球员卡</span></button>
      </aside>

      <!-- 中央 3D 球场 -->
      <main id="stage">
        <canvas id="game-canvas"></canvas>
        <div id="throw-hint" class="hidden">
          <div class="hint-line">👆 <b>轻点</b> QB = 高球 Lob</div>
          <div class="hint-line">✊ <b>长按</b> QB = 平快球 Bullet</div>
        </div>
        <div id="result-banner" class="hidden"></div>
      </main>

      <!-- 右侧功能按钮 -->
      <aside id="side-right">
        <button class="side-btn" id="btn-shop" title="商城">🛒<span>商城</span></button>
        <button class="side-btn" id="btn-settings" title="设置">⚙️<span>设置</span></button>
      </aside>

      <!-- 底部战术列表 -->
      <footer id="playcall">
        <div id="playcall-list"></div>
      </footer>

      <!-- 弹窗容器 -->
      <div id="modals"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
