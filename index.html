<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b3d1f" />
    <meta
      name="description"
      content="FFSIMU 腰旗橄榄球传球训练：黄昏街球场、真实球员动作、手机横屏即开即玩。"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FFSIMU" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>FFSimu — 腰旗橄榄球传球训练</title>
    <script type="module" crossorigin src="./assets/index-B4MHeoTN.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CrRNiB97.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="app">
      <!-- 全屏 3D 画布 -->
      <canvas id="game-canvas" aria-label="3D 球场"></canvas>

      <!-- 顶部：个人资料 + 战绩 + 资产 -->
      <header id="hud">
        <button class="profile-chip" id="profile-chip" aria-label="个人信息">
          <span class="prof-avatar" id="hud-avatar">🏈</span>
          <span class="prof-name" id="hud-name">新秀球员</span>
        </button>

        <div class="hud-stats">
          <div class="hud-item">
            <span class="hud-label">连击</span>
            <span id="hud-combo" class="hud-value">0</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">尝试</span>
            <span id="hud-attempts" class="hud-value">0</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">成功率</span>
            <span id="hud-rate" class="hud-value">—</span>
          </div>
        </div>

        <div class="wallet" id="wallet">
          <span class="wallet-item diamond"><span class="wi-icon">💎</span><b id="hud-diamonds">100</b></span>
          <span class="wallet-item coin"><span class="wi-icon">🪙</span><b id="hud-coins">20,000</b></span>
        </div>

        <div id="net-badge" class="hidden">📴 离线</div>
      </header>

      <!-- 左侧功能按钮 -->
      <aside id="side-left">
        <button class="side-btn" id="btn-draw" title="抽卡">🎴<span>抽卡</span></button>
        <button class="side-btn" id="btn-cards" title="球员卡">🃏<span>球员卡</span></button>
        <button class="side-btn" id="btn-playbook" title="战术手册">📖<span>战术本</span></button>
      </aside>

      <!-- 右侧功能按钮 -->
      <aside id="side-right">
        <button class="side-btn hidden" id="btn-install" title="安装到桌面">📲<span>安装</span></button>
        <button class="side-btn" id="btn-game" title="模拟比赛">🏆<span>比赛</span></button>
        <button class="side-btn" id="btn-shop" title="商城">🛒<span>商城</span></button>
        <button class="side-btn" id="btn-settings" title="设置">⚙️<span>设置</span></button>
      </aside>

      <!-- 叠在画面上的提示 / 评论区 -->
      <main id="stage">
        <div id="throw-hint" class="hidden">
          <div class="hint-line">👆 <b>轻点</b> QB = 高球 Lob</div>
          <div class="hint-line">✊ <b>长按</b> QB = 平快球 Bullet</div>
        </div>
        <div id="comment-feed" aria-live="polite"></div>
      </main>

      <!-- 底部战术列表 -->
      <footer id="playcall">
        <div id="play-options">
          <button id="reset-btn" class="opt-pill">复位</button>
          <button id="snap-btn" class="opt-pill">开球</button>
          <button id="side-toggle" class="opt-pill">右边路</button>
          <button id="def-toggle" class="opt-pill">防守 · 人盯人</button>
        </div>
        <div id="playcall-list"></div>
      </footer>

      <!-- 弹窗容器 -->
      <div id="modals"></div>

      <!-- 新版本提示 -->
      <div id="update-toast" class="hidden">
        <span class="ut-text">🚀 新版本已就绪</span>
        <button id="update-notes" class="ut-notes">查看更新</button>
        <button id="update-now">立即更新</button>
        <button id="update-later" class="ut-close" aria-label="稍后更新">✕</button>
      </div>

      <!-- 轻量提示 -->
      <div id="toast" class="hidden"></div>

      <!-- 竖屏锁定（本游戏只支持横屏） -->
      <div id="portrait-lock" class="hidden">
        <div class="pl-card">
          <div class="pl-icon">📱↻</div>
          <p>请把设备旋转到<b>横屏</b></p>
          <span>FFSIMU 只支持横屏游玩</span>
        </div>
      </div>

      <!-- 启动加载层 -->
      <div id="boot">
        <div class="boot-card">
          <img class="boot-logo-img" src="./icons/icon-192.png" alt="FFSIMU" />
          <h1>FFSIMU</h1>
          <p class="boot-sub">正在准备球场…</p>
        </div>
      </div>
    </div>
  </body>
</html>
