<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b3d1f" />
    <meta
      name="description"
      content="腰旗橄榄球传球训练：Madden 风格战术卡片 + 3D 球场，轻点高球、长按平快球，手机电脑都能玩。"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FF Pass" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>FFSimu — 腰旗橄榄球传球训练</title>
  </head>
  <body>
    <div id="app">
      <!-- 顶部 HUD -->
      <header id="hud">
        <div class="hud-brand">🏈 FFSIMU</div>
        <div id="net-badge" class="hidden">📴 离线</div>
        <div class="hud-item">
          <span class="hud-label">连击</span>
          <span id="hud-combo" class="hud-value">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">尝试</span>
          <span id="hud-attempts" class="hud-value">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">成功率</span>
          <span id="hud-rate" class="hud-value">—</span>
        </div>
      </header>

      <!-- 左侧功能按钮 -->
      <aside id="side-left">
        <button class="side-btn" id="btn-draw" title="抽卡">🎴<span>抽卡</span></button>
        <button class="side-btn" id="btn-cards" title="球员卡">🃏<span>球员卡</span></button>
        <button class="side-btn" id="btn-playbook" title="战术手册">📖<span>战术本</span></button>
      </aside>

      <!-- 中央 3D 球场 -->
      <main id="stage">
        <canvas id="game-canvas" aria-label="3D 球场"></canvas>
        <div id="throw-hint" class="hidden">
          <div class="hint-line">👆 <b>轻点</b> QB = 高球 Lob</div>
          <div class="hint-line">✊ <b>长按</b> QB = 平快球 Bullet</div>
        </div>
        <div id="result-banner" class="hidden"></div>
        <!-- 抖音评论区风格的结果消息 -->
        <div id="comment-feed" aria-live="polite"></div>

        <!-- 竖屏友好提示：不阻断操作 -->
        <div id="rotate-hint" class="hidden">
          <span>📱 横屏体验更佳</span>
          <button id="rotate-dismiss" aria-label="关闭提示">知道了</button>
        </div>
      </main>

      <!-- 右侧功能按钮 -->
      <aside id="side-right">
        <button class="side-btn hidden" id="btn-install" title="安装到桌面">📲<span>安装</span></button>
        <button class="side-btn" id="btn-game" title="模拟比赛">🏆<span>比赛</span></button>
        <button class="side-btn" id="btn-shop" title="商城">🛒<span>商城</span></button>
        <button class="side-btn" id="btn-settings" title="设置">⚙️<span>设置</span></button>
      </aside>

      <!-- 底部战术列表 -->
      <footer id="playcall">
        <div id="playcall-list"></div>
      </footer>

      <!-- 弹窗容器 -->
      <div id="modals"></div>

      <!-- 新版本提示 -->
      <div id="update-toast" class="hidden">
        <span class="ut-text">🚀 新版本已就绪</span>
        <button id="update-notes" class="ut-notes">查看更新</button>
        <button id="update-now">立即更新</button>
        <button id="update-later" class="ut-close" aria-label="稍后更新">✕</button>
      </div>

      <!-- 轻量提示 -->
      <div id="toast" class="hidden"></div>

      <!-- 启动加载层 -->
      <div id="boot">
        <div class="boot-card">
          <div class="boot-logo">🏈</div>
          <h1>FFSIMU</h1>
          <p class="boot-sub">正在准备球场…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
