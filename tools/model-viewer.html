<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #1b2230; overflow: hidden; }
      canvas { display: block; }
      #info { position: fixed; left: 8px; top: 8px; color: #0f0; font: 12px monospace; white-space: pre-wrap; background: #000a; padding: 6px; }
    </style>
  </head>
  <body>
    <div id="info">loading…</div>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
      import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

      const params = new URLSearchParams(location.search);
      const url = params.get('url');
      const info = document.getElementById('info');
      const yaw = Number(params.get('yaw') || 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1b2230);
      scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x2a3344, 2.0));
      const dir = new THREE.DirectionalLight(0xfff4e0, 2.6);
      dir.position.set(60, 90, 40);
      scene.add(dir);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 5000);
      const controls = new OrbitControls(camera, renderer.domElement);

      new GLTFLoader().load(
        url,
        (gltf) => {
          const root = gltf.scene;
          scene.add(root);
          root.updateMatrixWorld(true);
          const box = new THREE.Box3().setFromObject(root);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const dist = maxDim * 0.9;
          camera.position.set(center.x + Math.sin(yaw) * dist, center.y + maxDim * 0.55, center.z + Math.cos(yaw) * dist);
          camera.near = maxDim / 1000;
          camera.far = maxDim * 20;
          camera.updateProjectionMatrix();
          controls.target.copy(center);
          controls.update();

          let meshes = 0, tris = 0;
          root.traverse((o) => {
            if (o.isMesh) {
              meshes++;
              const g = o.geometry;
              tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
            }
          });
          info.textContent = `meshes=${meshes} tris=${Math.round(tris)}\nsize=${size.toArray().map((v) => v.toFixed(1))}`;
          renderer.render(scene, camera);
          window.__ready = true;
        },
        undefined,
        (err) => { info.textContent = 'ERROR ' + err; },
      );

      (function frame() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
