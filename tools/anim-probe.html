<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #1b2230; overflow: hidden; }
      canvas { display: block; }
      #info { position: fixed; left: 8px; top: 8px; color: #0f0; font: 12px monospace; white-space: pre-wrap; background: #000a; padding: 6px; }
    </style>
  </head>
  <body>
    <div id="info">loading…</div>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
      import { clone as cloneSkeleton } from 'three/examples/jsm/utils/SkeletonUtils.js';

      const q = new URLSearchParams(location.search);
      const modelUrl = q.get('model') || './models/qb.glb';
      const animsUrl = q.get('anims') || './图片模型/anims.glb';
      const clipName = q.get('clip') || 'Pass';
      const t = Number(q.get('t') || 0);
      const camYaw = Number(q.get('yaw') || 0.35);
      const info = document.getElementById('info');

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1b2230);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 2.2));
      const dir = new THREE.DirectionalLight(0xffffff, 2.6);
      dir.position.set(3, 6, 4);
      scene.add(dir);
      const grid = new THREE.GridHelper(6, 12, 0x445566, 0x334455);
      scene.add(grid);

      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.set(Math.sin(camYaw) * 4.2, 1.7, Math.cos(camYaw) * 4.2);
      camera.lookAt(0, 1.1, 0);

      const loader = new GLTFLoader();
      const [modelGltf, animsGltf] = await Promise.all([
        loader.loadAsync(modelUrl),
        loader.loadAsync(animsUrl),
      ]);

      const root = cloneSkeleton(modelGltf.scene);
      scene.add(root);
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(root);
      const height = box.getSize(new THREE.Vector3()).y;
      const scale = 1.9 / (height || 1);
      root.scale.setScalar(scale);
      root.position.y = -box.min.y * scale;

      const mixer = new THREE.AnimationMixer(root);
      const clip = animsGltf.animations.find((c) => c.name.toLowerCase().includes(clipName.toLowerCase()));
      if (clip) {
        const action = mixer.clipAction(clip);
        action.play();
        mixer.setTime(t);
      }
      renderer.render(scene, camera);

      info.textContent = `clips=${animsGltf.animations.map((a) => a.name + '@' + a.duration.toFixed(2)).join(', ')}\n` +
        `playing=${clip ? clip.name : 'NONE'} t=${t}\nmodel=${modelUrl}`;
      window.__ready = true;
      (function frame() {
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
